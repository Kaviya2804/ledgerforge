services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledgerforge
    volumes:
      - ledger_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledgerforge"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://ledger:ledger@db:5432/ledgerforge
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /03_Data/csv
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:?Set DEMO_ADMIN_PASSWORD in .env}
      DEMO_HR_PASSWORD: ${DEMO_HR_PASSWORD:?Set DEMO_HR_PASSWORD in .env}
      DEMO_EMPLOYEE_PASSWORD: ${DEMO_EMPLOYEE_PASSWORD:?Set DEMO_EMPLOYEE_PASSWORD in .env}
    volumes:
      - ../03_Data/csv:/03_Data/csv:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
    command: celery -A app.celery_app:celery_app worker --loglevel=info --pool=solo
    environment:
      DATABASE_URL: postgresql+psycopg2://ledger:ledger@db:5432/ledgerforge
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /03_Data/csv
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:?Set DEMO_ADMIN_PASSWORD in .env}
      DEMO_HR_PASSWORD: ${DEMO_HR_PASSWORD:?Set DEMO_HR_PASSWORD in .env}
      DEMO_EMPLOYEE_PASSWORD: ${DEMO_EMPLOYEE_PASSWORD:?Set DEMO_EMPLOYEE_PASSWORD in .env}
    volumes:
      - ../03_Data/csv:/03_Data/csv:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  ledger_pg:


