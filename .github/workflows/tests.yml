name: LedgerForge CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      SECRET_KEY: "ci-only-secret-key-for-testing"
      DEMO_ADMIN_PASSWORD: "CiOnlyAdminPass123!"
      DEMO_HR_PASSWORD: "CiOnlyHRPass123!"
      DEMO_EMPLOYEE_PASSWORD: "CiOnlyEmployeePass123!"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        run: pytest tests/ --cov=app --cov-report=term-missing -q